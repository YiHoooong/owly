[package]
name = "owly-radio"
description = "The radio on Linux: the Backend trait and its injection backend, capability probing and quirks, owly-awdl over nl80211."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["awdl", "airdrop", "wifi", "nl80211", "linux"]
categories = ["network-programming", "os::linux-apis", "hardware-support"]

[dependencies]
crc32fast = "1"
owly-awdl = { version = "0.4.3", path = "../owly-awdl", features = ["driver"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = "0.9"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "net", "process", "signal", "socket", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["user"] }

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
